[env:esp32dev]
platform = espressif32
board = esp32dev
; board_build.partitions = huge_app.csv ; MỞ RỘNG PHÂN VÙNG APP LÊN 3MB
; Khai báo kiến trúc lai (ESP-IDF làm lõi chính, Arduino làm module)
framework = arduino, espidf
monitor_speed = 115200
; THÊM DÒNG NÀY: Hạ xung nhịp CPU từ 240MHz xuống 160MHz để giảm 30% lượng nhiệt tỏa ra
; board_build.f_cpu = 160000000L

; BỔ SUNG 2 DÒNG NÀY ĐỂ NGĂN TERMINAL ÉP CHIP VÀO CHẾ ĐỘ NẠP
monitor_dtr = 0
monitor_rts = 0

lib_deps =
;    bodmer/TFT_eSPI @ ^2.5.43
;    https://github.com/PaulStoffregen/XPT2046_Touchscreen.git
;    lvgl/lvgl @ ~8.3.11
    bblanchon/ArduinoJson @ ^6.21.3

    