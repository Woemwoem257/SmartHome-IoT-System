<!doctype html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SmartHome Dashboard</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
  
  <!-- 1. NHÚNG THƯ VIỆN WEBSOCKET VÀ CHART.JS -->
  <script src="/socket.io/socket.io.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-light">
  <!-- Navbar -->
  <nav class="navbar navbar-dark bg-dark mb-4 shadow">
    <div class="container">
      <span class="navbar-brand mb-0 h1">Hệ thống Điều khiển ESP32 - Realtime Dashboard</span>
    </div>
  </nav>

  <div class="container">
    <!-- Khối Hiển thị Số liệu Tức thời -->
    <div class="row mb-4">
      <div class="col-md-6 mb-3">
        <div class="card bg-primary text-white text-center shadow">
          <div class="card-body">
            <h5>NHIỆT ĐỘ HIỆN TẠI</h5>
            <h2 class="fw-bold"><span id="temperature">--</span> °C</h2>
          </div>
        </div>
      </div>
      <div class="col-md-6 mb-3">
        <div class="card bg-info text-white text-center shadow">
          <div class="card-body">
            <h5>ĐỘ ẨM HIỆN TẠI</h5>
            <h2 class="fw-bold"><span id="humidity">--</span> %</h2>
          </div>
        </div>
      </div>
    </div>

    <!-- Khối Hiển thị Biểu đồ Thời gian thực -->
    <div class="row mb-4">
      <div class="col-12">
        <div class="card shadow">
          <div class="card-header bg-dark text-white fw-bold">Biểu đồ Viễn trắc (Real-time Telemetry)</div>
          <div class="card-body">
            <canvas id="telemetryChart" height="100"></canvas>
          </div>
        </div>
      </div>
    </div>

    <!-- Khối Điều khiển Thiết bị (Giữ nguyên cấu trúc HTML) -->
    <div class="row">
      <div class="col-md-6 mb-4">
        <div class="card shadow">
          <div class="card-header bg-dark text-white fw-bold">Quản lý Mosfet (Quạt / DC)</div>
          <ul class="list-group list-group-flush" id="mosfet-list"></ul>
        </div>
      </div>
      <div class="col-md-6 mb-4">
        <div class="card shadow">
          <div class="card-header bg-dark text-white fw-bold">Quản lý Relay (Đèn / AC)</div>
          <ul class="list-group list-group-flush" id="relay-list"></ul>
        </div>
      </div>
    </div>
  </div>

  <!-- Lớp Logic Tương tác (Client-side JavaScript) -->
  <script>
    /* =========================================================================
     * A1. KHỞI TẠO BIỂU ĐỒ CHART.JS
     * ========================================================================= */
    const ctx = document.getElementById('telemetryChart').getContext('2d');
    const telemetryChart = new Chart(ctx, {
        type: 'line',
        data: {
            labels: [], // Trục X: Thời gian
            datasets: [
                {
                    label: 'Nhiệt độ (°C)',
                    data: [], // Trục Y1
                    borderColor: 'rgb(255, 99, 132)',
                    backgroundColor: 'rgba(255, 99, 132, 0.2)',
                    tension: 0.4, // Làm mượt đường cong
                    fill: true
                },
                {
                    label: 'Độ ẩm (%)',
                    data: [], // Trục Y2
                    borderColor: 'rgb(54, 162, 235)',
                    backgroundColor: 'rgba(54, 162, 235, 0.2)',
                    tension: 0.4,
                    fill: true
                }
            ]
        },
        options: {
            responsive: true,
            animation: false, // TẮT ANIMATION để tối ưu render Real-time
            scales: {
                y: { beginAtZero: false } // Không bắt đầu từ 0 để đồ thị dao động rõ hơn
            }
        }
    });

    /* =========================================================================
     * A2. TẢI LỊCH SỬ DỮ LIỆU TỪ MONGODB KHI VỪA MỞ TRANG
     * ========================================================================= */
    async function loadChartHistory() {
        try {
            const response = await fetch('/api/v1/sensor/history');
            const result = await response.json();
            
            if (result.success && result.data.length > 0) {
                result.data.forEach(point => {
                    // Chuyển đổi timestamp ISO thành giờ địa phương
                    const timeString = new Date(point.timestamp).toLocaleTimeString('vi-VN');
                    
                    telemetryChart.data.labels.push(timeString);
                    telemetryChart.data.datasets[0].data.push(point.temperature);
                    telemetryChart.data.datasets[1].data.push(point.humidity);
                });
                // Ép Chart.js vẽ lại toàn bộ 30 điểm
                telemetryChart.update();
            }
        } catch (error) {
            console.error('[Giao diện] Lỗi tải lịch sử biểu đồ:', error);
        }
    }

    // Thực thi hàm ngay lập tức
    loadChartHistory();

    /* =========================================================================
     * B. KẾT NỐI WEBSOCKET & XỬ LÝ SỰ KIỆN TỪ BACKEND
     * ========================================================================= */
    const socket = io(); // Tự động dò tìm và kết nối đến cùng một Domain/Port

    // Lắng nghe sự kiện viễn trắc từ MQTT dội xuống
    socket.on('device:sensor_update', (data) => {
        // 1. Cập nhật thẻ hiển thị số
        document.getElementById('temperature').innerText = data.temperature;
        document.getElementById('humidity').innerText = data.humidity;

        // 2. Cập nhật Biểu đồ
        const timeNow = new Date().toLocaleTimeString('vi-VN');
        
        telemetryChart.data.labels.push(timeNow);
        telemetryChart.data.datasets[0].data.push(data.temperature);
        telemetryChart.data.datasets[1].data.push(data.humidity);

        // Kỹ thuật Cửa sổ trượt (Sliding Window): Giữ tối đa 30 điểm dữ liệu
        if (telemetryChart.data.labels.length > 30) {
            telemetryChart.data.labels.shift();
            telemetryChart.data.datasets[0].data.shift();
            telemetryChart.data.datasets[1].data.shift();
        }
        
        telemetryChart.update();
    });

    /* =========================================================================
     * C. QUẢN LÝ ĐIỀU KHIỂN (GỌI API RESTful NHƯ CŨ)
     * ========================================================================= */
    const mosfets = ['mosfet1', 'mosfet2'];
    const relays = ['relay1', 'relay2'];
    let deviceStates = {}; 

    function renderDeviceList(deviceArray, containerId) {
      const container = document.getElementById(containerId);
      deviceArray.forEach(deviceName => {
        deviceStates[deviceName] = 0; 
        
        const li = document.createElement('li');
        li.className = 'list-group-item d-flex justify-content-between align-items-center py-3';
        li.innerHTML = `
          <strong class="text-uppercase">${deviceName.replace('_', ' ')}</strong>
          <div class="d-flex align-items-center">
            <span id="badge-${deviceName}" class="badge bg-secondary me-3">OFF</span>
            <button id="btn-${deviceName}" class="btn btn-sm btn-primary" onclick="toggleDevice('${deviceName}')">BẬT</button>
          </div>
        `;
        container.appendChild(li);
      });
    }

    renderDeviceList(mosfets, 'mosfet-list');
    renderDeviceList(relays, 'relay-list');

    async function toggleDevice(deviceName) {
      const newStatus = deviceStates[deviceName] === 1 ? 0 : 1;
      
      try {
        const response = await fetch('/api/v1/device/control', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ device_name: deviceName, status: newStatus })
        });
        
        const result = await response.json();
        if (result.success) {
          deviceStates[deviceName] = newStatus;
          updateDeviceUI(deviceName, newStatus);
        } else {
          alert('Lỗi điều khiển: ' + result.message);
        }
      } catch (error) {
        console.error('[Giao diện] Lỗi điều khiển:', error);
      }
    }

    function updateDeviceUI(deviceName, status) {
      const badge = document.getElementById(`badge-${deviceName}`);
      const btn = document.getElementById(`btn-${deviceName}`);
      
      if (status === 1) {
        badge.className = 'badge bg-success me-3';
        badge.innerText = 'ON';
        btn.className = 'btn btn-sm btn-danger';
        btn.innerText = 'TẮT';
      } else {
        badge.className = 'badge bg-secondary me-3';
        badge.innerText = 'OFF';
        btn.className = 'btn btn-sm btn-primary';
        btn.innerText = 'BẬT';
      }
    }

    // Lắng nghe sự kiện đồng bộ trạng thái thực tế từ thiết bị (Nâng cao)
    socket.on('device:state_sync', (data) => {
        // data payload từ MQTT: {"relay1": 1}
        const deviceName = Object.keys(data)[0];
        const status = data[deviceName];
        if (deviceStates.hasOwnProperty(deviceName)) {
            deviceStates[deviceName] = status;
            updateDeviceUI(deviceName, status);
        }
    });
  </script>
</body>
</html>
