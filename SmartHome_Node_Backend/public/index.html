<!doctype html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SmartHome IoT Dashboard</title>
  
  <!-- Thư viện CSS & Icon -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- Thư viện Logic -->
  <script src="/socket.io/socket.io.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <style>
    body { background-color: #f4f7f6; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    .navbar { background: linear-gradient(135deg, #1e293b, #0f172a); }
    .card { border: none; border-radius: 12px; transition: transform 0.2s; margin-bottom: 20px; }
    .card:hover { transform: translateY(-3px); box-shadow: 0 10px 20px rgba(0,0,0,0.1) !important; }
    .bg-gradient-temp { background: linear-gradient(135deg, #ff6b6b, #ee5253); color: white; }
    .bg-gradient-hum { background: linear-gradient(135deg, #48dbfb, #0abde3); color: white; }
    .bg-gradient-alarm { background: linear-gradient(135deg, #ff9f43, #ff6200); color: white; }
    .btn-custom { border-radius: 20px; font-weight: bold; padding: 6px 20px; transition: all 0.3s; }
    .list-group-item { border-left: 4px solid transparent; transition: all 0.2s; }
    .list-group-item:hover { border-left: 4px solid #3498db; background-color: #f8f9fa; }
    .status-badge { font-size: 0.85rem; padding: 6px 12px; border-radius: 12px; }
  </style>
</head>
<body>
  <!-- Trạm điều phối trung tâm (Navbar) -->
  <nav class="navbar navbar-dark shadow-sm mb-4">
    <div class="container d-flex justify-content-between align-items-center">
      <span class="navbar-brand mb-0 h1"><i class="fa-solid fa-microchip me-2"></i>ESP32/STM32 IoT Gateway</span>
      <span class="badge bg-success" id="connection-status"><i class="fa-solid fa-wifi me-1"></i>Live</span>
    </div>
  </nav>

  <div class="container">
    <!-- Phân hệ 1: Hệ thống An ninh (Đẩy lên đầu để gây ấn tượng) -->
    <div class="row mb-2">
      <div class="col-12">
        <div class="card bg-gradient-alarm shadow text-center py-3">
          <div class="card-body">
            <h4 class="fw-bold"><i class="fa-solid fa-triangle-exclamation fa-beat me-2"></i>HỆ THỐNG CẢNH BÁO AN NINH</h4>
            <p class="mb-3">Kiểm soát trạng thái cảm biến khói MQ-2 và còi báo động</p>
            <button class="btn btn-light text-danger btn-lg btn-custom shadow-sm" onclick="clearAlarm()">
              <i class="fa-solid fa-shield-halved me-2"></i>GIẢI TRỪ BÁO CHÁY
            </button>
          </div>
        </div>
      </div>
    </div>

    <!-- Phân hệ 2: Trạm Viễn trắc (Telemetry) -->
    <div class="row">
      <div class="col-md-6">
        <div class="card bg-gradient-temp shadow">
          <div class="card-body text-center">
            <h5 class="text-uppercase opacity-75"><i class="fa-solid fa-temperature-half me-2"></i>Nhiệt độ</h5>
            <h1 class="fw-bold display-4"><span id="temperature">--</span>°C</h1>
          </div>
        </div>
      </div>
      <div class="col-md-6">
        <div class="card bg-gradient-hum shadow">
          <div class="card-body text-center">
            <h5 class="text-uppercase opacity-75"><i class="fa-solid fa-droplet me-2"></i>Độ ẩm</h5>
            <h1 class="fw-bold display-4"><span id="humidity">--</span>%</h1>
          </div>
        </div>
      </div>
    </div>

    <!-- Phân hệ 3: Biểu đồ -->
    <div class="row">
      <div class="col-12">
        <div class="card shadow">
          <div class="card-header bg-white fw-bold py-3">
            <i class="fa-solid fa-chart-line text-primary me-2"></i>Phân tích Dữ liệu Thời gian thực
          </div>
          <div class="card-body">
            <canvas id="telemetryChart" height="80"></canvas>
          </div>
        </div>
      </div>
    </div>

    <!-- Phân hệ 4: Cơ cấu chấp hành (Actuators) -->
    <div class="row">
      <div class="col-md-6">
        <div class="card shadow">
          <div class="card-header bg-white fw-bold py-3">
            <i class="fa-solid fa-fan text-success me-2"></i>Cụm MOSFET (Tải DC)
          </div>
          <ul class="list-group list-group-flush" id="mosfet-list"></ul>
        </div>
      </div>
      <div class="col-md-6">
        <div class="card shadow">
          <div class="card-header bg-white fw-bold py-3">
            <i class="fa-regular fa-lightbulb text-warning me-2"></i>Cụm Relay (Tải AC)
          </div>
          <ul class="list-group list-group-flush" id="relay-list"></ul>
        </div>
      </div>
    </div>
  </div>

  <script>
    // =========================================================================
    // 1. CẤU HÌNH CHART.JS
    // =========================================================================
    const ctx = document.getElementById('telemetryChart').getContext('2d');
    const telemetryChart = new Chart(ctx, {
        type: 'line',
        data: {
            labels: [], 
            datasets: [
                {
                    label: 'Nhiệt độ (°C)',
                    data: [], 
                    borderColor: '#ff6b6b',
                    backgroundColor: 'rgba(255, 107, 107, 0.1)',
                    tension: 0.4, fill: true, borderWidth: 2, pointRadius: 3
                },
                {
                    label: 'Độ ẩm (%)',
                    data: [], 
                    borderColor: '#48dbfb',
                    backgroundColor: 'rgba(72, 219, 251, 0.1)',
                    tension: 0.4, fill: true, borderWidth: 2, pointRadius: 3
                }
            ]
        },
        options: {
            responsive: true, animation: false,
            plugins: { legend: { position: 'top' } },
            scales: { y: { beginAtZero: false } }
        }
    });

    async function loadChartHistory() {
        try {
            const response = await fetch('/api/v1/sensor/history');
            const result = await response.json();
            if (result.success && result.data.length > 0) {
                result.data.forEach(point => {
                    const timeString = new Date(point.timestamp).toLocaleTimeString('vi-VN');
                    telemetryChart.data.labels.push(timeString);
                    telemetryChart.data.datasets[0].data.push(point.temperature);
                    telemetryChart.data.datasets[1].data.push(point.humidity);
                });
                telemetryChart.update();
            }
        } catch (error) { console.error('Lỗi tải lịch sử:', error); }
    }
    loadChartHistory();

    // =========================================================================
    // 2. GIAO TIẾP WEBSOCKET THỜI GIAN THỰC
    // =========================================================================
    const socket = io();
    const connStatus = document.getElementById('connection-status');

    socket.on('connect', () => {
        connStatus.className = 'badge bg-success';
        connStatus.innerHTML = '<i class="fa-solid fa-wifi me-1"></i>Live';
    });

    socket.on('disconnect', () => {
        connStatus.className = 'badge bg-danger';
        connStatus.innerHTML = '<i class="fa-solid fa-link-slash me-1"></i>Mất kết nối';
    });

    socket.on('device:sensor_update', (data) => {
        document.getElementById('temperature').innerText = data.temperature;
        document.getElementById('humidity').innerText = data.humidity;

        const timeNow = new Date().toLocaleTimeString('vi-VN');
        telemetryChart.data.labels.push(timeNow);
        telemetryChart.data.datasets[0].data.push(data.temperature);
        telemetryChart.data.datasets[1].data.push(data.humidity);

        if (telemetryChart.data.labels.length > 30) {
            telemetryChart.data.labels.shift();
            telemetryChart.data.datasets[0].data.shift();
            telemetryChart.data.datasets[1].data.shift();
        }
        telemetryChart.update();
    });

    // =========================================================================
    // 3. LOGIC ĐIỀU KHIỂN & BẢO MẬT API KEY
    // =========================================================================
    const API_KEY = 'IOT_BAO_VE_2026'; // Chìa khóa tĩnh cấp quyền điều khiển
    const mosfets = ['mosfet1', 'mosfet2'];
    const relays = ['relay1', 'relay2'];
    let deviceStates = {}; 

    function renderDeviceList(deviceArray, containerId) {
      const container = document.getElementById(containerId);
      deviceArray.forEach(deviceName => {
        deviceStates[deviceName] = 0; 
        
        const li = document.createElement('li');
        li.className = 'list-group-item d-flex justify-content-between align-items-center py-3';
        li.innerHTML = `
          <strong class="text-uppercase text-secondary">${deviceName.replace('_', ' ')}</strong>
          <div class="d-flex align-items-center">
            <span id="badge-${deviceName}" class="badge bg-secondary status-badge me-3">OFF</span>
            <button id="btn-${deviceName}" class="btn btn-outline-primary btn-custom" onclick="toggleDevice('${deviceName}')">BẬT</button>
          </div>
        `;
        container.appendChild(li);
      });
    }

    renderDeviceList(mosfets, 'mosfet-list');
    renderDeviceList(relays, 'relay-list');

    // Nút điều khiển Thiết bị
    async function toggleDevice(deviceName) {
      const newStatus = deviceStates[deviceName] === 1 ? 0 : 1;
      try {
        const response = await fetch('/api/v1/device/control', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'x-api-key': API_KEY },
          body: JSON.stringify({ device_name: deviceName, status: newStatus })
        });
        
        const result = await response.json();
        if (result.success) {
            // Tạm đổi UI chờ ACK từ phần cứng
            updateDeviceUI(deviceName, newStatus); 
        } else {
            alert('Từ chối truy cập: ' + result.message);
        }
      } catch (error) { console.error('Lỗi điều khiển:', error); }
    }

    // Nút Giải trừ báo động
    async function clearAlarm() {
      if(!confirm("Xác nhận giải trừ hệ thống báo cháy?")) return;
      
      try {
        const response = await fetch('/api/v1/alarm/clear', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'x-api-key': API_KEY }
        });
        
        const result = await response.json();
        if (result.success) {
            alert('Lệnh giải trừ đã được gửi xuống Gateway!');
        } else {
            alert('Lỗi: ' + result.message);
        }
      } catch (error) { console.error('Lỗi giải trừ báo động:', error); }
    }

    function updateDeviceUI(deviceName, status) {
      const badge = document.getElementById(`badge-${deviceName}`);
      const btn = document.getElementById(`btn-${deviceName}`);
      
      if (status === 1) {
        badge.className = 'badge bg-success status-badge me-3';
        badge.innerText = 'ON';
        btn.className = 'btn btn-danger btn-custom';
        btn.innerText = 'TẮT';
      } else {
        badge.className = 'badge bg-secondary status-badge me-3';
        badge.innerText = 'OFF';
        btn.className = 'btn btn-outline-primary btn-custom';
        btn.innerText = 'BẬT';
      }
    }

    // Xử lý ACK từ MQTT để chốt trạng thái chính xác
    socket.on('device:state_sync', (data) => {
        const deviceName = Object.keys(data)[0];
        const status = data[deviceName];
        if (deviceStates.hasOwnProperty(deviceName)) {
            deviceStates[deviceName] = status;
            updateDeviceUI(deviceName, status);
        }
    });
  </script>
</body>
</html>
